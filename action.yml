name: "eval churn gate"
description: "Gate a model evaluation on the transitions as well as the aggregate, and exit 2 rather than 0 when the eval set cannot resolve the difference"
author: "Srujan Sadineni"
branding:
  icon: "git-pull-request"
  color: "red"

# Three exit codes reach the caller, and which one becomes a failed step is the
# whole reason this file exists rather than a bare `run:` line. Exit 1 is a
# detected regression and fails. Exit 2 means the eval set could not resolve the
# difference, which is not a pass and not a regression, so `undecidable-fails`
# decides it and defaults to false: a team adopting this should see the verdict
# before it starts blocking on it. Exit 3 and 4 are always failures, because they
# mean the gate did not run.

inputs:
  policy:
    description: "Path to the policy file with the thresholds and the measured noise parameters"
    required: false
    default: "configs/policy.yaml"
  scenario:
    description: "Which comparison to gate"
    required: false
    default: "compensating"
  html:
    description: "Optional path for the self contained HTML report"
    required: false
    default: ""
  warn-only:
    description: "Report the verdict and never fail the step"
    required: false
    default: "false"
  undecidable-fails:
    description: "Whether exit 2, the eval set cannot resolve this, fails the step"
    required: false
    default: "false"

outputs:
  verdict:
    description: "regression-detected, passes, or eval-set-cannot-resolve-this"
    value: ${{ steps.gate.outputs.verdict }}
  exit-code:
    description: "The gate's own exit code, whatever this action did about it"
    value: ${{ steps.gate.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Install the gate
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"

    - name: Run the gate
      id: gate
      shell: bash
      run: |
        set +e
        html_flag=""
        if [ -n "${{ inputs.html }}" ]; then
          html_flag="--html ${{ inputs.html }}"
        fi
        output=$(python -m churngate gate \
          --policy "${{ inputs.policy }}" \
          --scenario "${{ inputs.scenario }}" \
          $html_flag 2>&1)
        code=$?
        set -e
        echo "$output"
        verdict=$(printf '%s\n' "$output" | sed -n 's/^verdict: //p' | head -1)
        echo "verdict=${verdict}" >> "$GITHUB_OUTPUT"
        echo "exit-code=${code}" >> "$GITHUB_OUTPUT"

        {
          echo "### Evaluation gate"
          echo
          echo "Verdict: \`${verdict}\`, exit code ${code}."
          echo
          echo '```'
          printf '%s\n' "$output"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

        if [ "${{ inputs.warn-only }}" = "true" ]; then
          echo "warn-only is set, so this step passes whatever the gate said"
          exit 0
        fi
        if [ "$code" = "2" ] && [ "${{ inputs.undecidable-fails }}" != "true" ]; then
          echo "::warning::the eval set could not resolve this difference, which is not a pass"
          exit 0
        fi
        exit $code
